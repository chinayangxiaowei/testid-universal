name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Pin the npm that writes package-lock.json. npm 10 (Node 22) and newer npm 11.x
      # (>= 11.2x) resolve the optional wasm peer deps (@napi-rs/wasm-runtime ->
      # @emnapi/core, @emnapi/runtime) differently and reject this lockfile in `npm ci`.
      # Bump this together with regenerating the lockfile on the same npm version.
      - run: npm install -g npm@11.6.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
