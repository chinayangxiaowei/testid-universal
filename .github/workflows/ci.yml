name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The lockfile is written by npm 11; npm 10 (bundled with Node 22) resolves the
      # optional wasm peer deps (@emnapi/*) differently and rejects it in `npm ci`.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
